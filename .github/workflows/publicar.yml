name: Publicar en Instagram

# Todos los días desde las 6:00 de RD (10:00 UTC). publicar.py espera hasta las
# 7:00 en punto. Si hoy no hay nada aprobado en la cola, termina en verde sin
# tocar nada.
#
# TRES disparos y no uno: el primer cron de este repo (12 sep 2026) estaba
# puesto a las 10:30 UTC y GitHub lo lanzó a las 13:41, tres horas tarde. Con
# varios, el primero que llegue publica; los demás esperan su turno por la
# `concurrency`, ven el PUBLICADO.json y no repiten.
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "20 10 * * *"
    - cron: "40 10 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: hace todo menos publicar"
        type: boolean
        default: true
      fecha:
        description: "Entrada de la cola, AAAA-MM-DD (vacío = hoy en RD)"
        type: string
        default: ""

permissions:
  contents: write          # para guardar PUBLICADO.json

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # La punta de la rama en el momento de arrancar, no el commit del disparo:
      # si otro disparo ya publicó mientras este esperaba en la cola, aquí tiene
      # que aparecer su PUBLICADO.json, o saldría el post dos veces.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: Publicar lo que toque hoy
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN_EXPIRA: ${{ vars.IG_TOKEN_EXPIRA }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && 'true' || 'false' }}
          FECHA: ${{ inputs.fecha }}
        run: python3 publicar.py

      # always(): si se publicó y algo falló después, el registro tiene que
      # quedar igual, o relanzar el job lo publicaría dos veces.
      - name: Guardar PUBLICADO.json
        if: always()
        run: |
          if [ -n "$(git status --porcelain cola)" ]; then
            git config user.name "ig-cola"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cola
            git commit -m "publicado $(date -u +%F)"
            git push
          fi
